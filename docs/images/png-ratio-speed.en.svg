<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="804" viewBox="0 0 1100 804" role="img" aria-labelledby="title">
<title id="title">PNG encoding: compression ratio and encode speed</title>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.bg{fill:#fcfcfb}.t1{font-size:21px;font-weight:700;fill:#0b0b0b}.t2{font-size:13px;fill:#52514e}
.st{font-size:14.5px;font-weight:700;fill:#0b0b0b}.ch{font-size:14px;font-weight:700;fill:#0b0b0b}.cs{font-size:12px;fill:#52514e}
.nm{font-size:13px;fill:#52514e}.nmm{font-size:13.5px;font-weight:700;fill:#0b0b0b}
.v{font-size:12.5px;fill:#52514e}.vm{font-size:13px;font-weight:700;fill:#0b0b0b}
.cap{font-size:11.5px;fill:#6f6d68}.ax{stroke:#8f8d86;stroke-width:1}.grid{stroke:#e4e3df;stroke-width:1}
.b0{fill:#2a78d6}.b1{fill:#a3a29c}.d0{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2}.d1{fill:#a3a29c;stroke:#fcfcfb;stroke-width:2}
.band{fill:#2a78d6;fill-opacity:.07}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1,.st,.ch,.nmm,.vm{fill:#f0efec}.t2,.cs,.nm,.v{fill:#c3c2b7}.cap{fill:#9a9891}
.grid{stroke:#383835}.b0{fill:#3987e5}.b1{fill:#6f6d68}.d0{fill:#3987e5;stroke:#1a1a19}.d1{fill:#6f6d68;stroke:#1a1a19}
.band{fill:#3987e5;fill-opacity:.12}}
</style>
<rect class="bg" width="100%" height="100%"/>
<text class="t1" x="24" y="40">PNG encoding: compression ratio and encode speed</text>
<text class="t2" x="24" y="64">97 public images (photos, screenshots, icons, textures, cut-outs with alpha; 69.8 MP), single thread. Each group is one compression level.</text>
<rect class="b0" x="24" y="80" width="14" height="10" rx="2"/><text class="cs" x="44" y="90">moego/png (pure Go)</text><rect class="b1" x="188" y="80" width="14" height="10" rx="2"/><text class="cs" x="208" y="90">Other encoders; (C) marks C libraries called through cgo</text>
<text class="ch" x="210" y="132">Compression ratio ← smaller files to the left</text><text class="cs" x="210" y="150">Compressed size over the raw pixel data; the axis starts at 30%</text>
<text class="ch" x="640" y="132">Encode speed → longer is faster</text><text class="cs" x="640" y="150">Megapixels encoded per second (MP/s); bars scaled to the fastest in each group</text>
<line class="grid" x1="210.0" x2="210.0" y1="170" y2="726"/><text class="cs" x="210.0" y="742" text-anchor="middle">30%</text>
<line class="grid" x1="278.0" x2="278.0" y1="170" y2="726"/><text class="cs" x="278.0" y="742" text-anchor="middle">32%</text>
<line class="grid" x1="346.0" x2="346.0" y1="170" y2="726"/><text class="cs" x="346.0" y="742" text-anchor="middle">34%</text>
<line class="grid" x1="414.0" x2="414.0" y1="170" y2="726"/><text class="cs" x="414.0" y="742" text-anchor="middle">36%</text>
<line class="grid" x1="482.0" x2="482.0" y1="170" y2="726"/><text class="cs" x="482.0" y="742" text-anchor="middle">38%</text>
<line class="grid" x1="550.0" x2="550.0" y1="170" y2="726"/><text class="cs" x="550.0" y="742" text-anchor="middle">40%</text>
<line class="ax" x1="640" x2="640" y1="170" y2="726"/>
<text class="st" x="24" y="192.0">BestSpeed (fastest)</text>
<rect class="band" x="16" y="215.0" width="1068" height="24" rx="4"/><g><title>moego/png: ratio 34.61% (78.0 MB), 26.64 MP/s</title><text class="nmm" x="178" y="231.5" text-anchor="end">moego/png</text><circle class="d0" cx="366.6" cy="227.0" r="7.0"/><text class="vm" x="378.6" y="231.5">34.6%</text><path class="b0" d="M640.0 220.0 h38.1 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-38.1 z"/><text class="vm" x="688.1" y="231.5">26.6, 2.5× image/png</text></g>
<g><title>image/png: ratio 36.16% (81.5 MB), 10.65 MP/s</title><text class="nm" x="178" y="257.5" text-anchor="end">image/png</text><circle class="d1" cx="419.5" cy="253.0" r="5.5"/><text class="v" x="430.0" y="257.5">36.2%</text><path class="b1" d="M640.0 246.0 h12.8 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-12.8 z"/><text class="v" x="662.8" y="257.5">10.7</text></g>
<g><title>woozymasta/png: ratio 36.67% (82.7 MB), 15.05 MP/s</title><text class="nm" x="178" y="283.5" text-anchor="end">woozymasta/png</text><circle class="d1" cx="436.9" cy="279.0" r="5.5"/><text class="v" x="447.4" y="283.5">36.7%</text><path class="b1" d="M640.0 272.0 h19.8 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-19.8 z"/><text class="v" x="669.8" y="283.5">15.1</text></g>
<g><title>libdeflate 1 (C): ratio 34.77% (78.4 MB), 16.94 MP/s</title><text class="nm" x="178" y="309.5" text-anchor="end">libdeflate 1 (C)</text><circle class="d1" cx="372.2" cy="305.0" r="5.5"/><text class="v" x="382.7" y="309.5">34.8%</text><path class="b1" d="M640.0 298.0 h22.7 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-22.7 z"/><text class="v" x="672.7" y="309.5">16.9</text></g>
<g><title>libpng 1 (C): ratio 35.89% (80.9 MB), 13.60 MP/s</title><text class="nm" x="178" y="335.5" text-anchor="end">libpng 1 (C)</text><circle class="d1" cx="410.3" cy="331.0" r="5.5"/><text class="v" x="420.8" y="335.5">35.9%</text><path class="b1" d="M640.0 324.0 h17.5 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-17.5 z"/><text class="v" x="667.5" y="335.5">13.6</text></g>
<g><title>fpnge (C): ratio 39.07% (88.1 MB), 152.06 MP/s</title><text class="nm" x="178" y="361.5" text-anchor="end">fpnge (C)</text><circle class="d1" cx="518.4" cy="357.0" r="5.5"/><text class="v" x="528.9" y="361.5">39.1%</text><path class="b1" d="M640.0 350.0 h236.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-236.0 z"/><text class="v" x="886.0" y="361.5">152</text></g>
<text class="st" x="24" y="394.0">Default</text>
<rect class="band" x="16" y="417.0" width="1068" height="24" rx="4"/><g><title>moego/png: ratio 33.50% (75.5 MB), 11.98 MP/s</title><text class="nmm" x="178" y="433.5" text-anchor="end">moego/png</text><circle class="d0" cx="328.9" cy="429.0" r="7.0"/><text class="vm" x="340.9" y="433.5">33.5%</text><path class="b0" d="M640.0 422.0 h236.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-236.0 z"/><text class="vm" x="886.0" y="433.5">12.0, 2.7× image/png</text></g>
<g><title>image/png: ratio 33.64% (75.9 MB), 4.38 MP/s</title><text class="nm" x="178" y="459.5" text-anchor="end">image/png</text><circle class="d1" cx="333.8" cy="455.0" r="5.5"/><text class="v" x="344.3" y="459.5">33.6%</text><path class="b1" d="M640.0 448.0 h83.7 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-83.7 z"/><text class="v" x="733.7" y="459.5">4.4</text></g>
<g><title>woozymasta/png: ratio 34.96% (78.8 MB), 10.93 MP/s</title><text class="nm" x="178" y="485.5" text-anchor="end">woozymasta/png</text><circle class="d1" cx="378.7" cy="481.0" r="5.5"/><text class="v" x="389.2" y="485.5">35.0%</text><path class="b1" d="M640.0 474.0 h215.1 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-215.1 z"/><text class="v" x="865.1" y="485.5">10.9</text></g>
<g><title>libdeflate 6 (C): ratio 33.66% (75.9 MB), 11.21 MP/s</title><text class="nm" x="178" y="511.5" text-anchor="end">libdeflate 6 (C)</text><circle class="d1" cx="334.5" cy="507.0" r="5.5"/><text class="v" x="345.0" y="511.5">33.7%</text><path class="b1" d="M640.0 500.0 h220.6 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-220.6 z"/><text class="v" x="870.6" y="511.5">11.2</text></g>
<g><title>libpng 6 (C): ratio 33.87% (76.4 MB), 4.32 MP/s</title><text class="nm" x="178" y="537.5" text-anchor="end">libpng 6 (C)</text><circle class="d1" cx="341.6" cy="533.0" r="5.5"/><text class="v" x="352.1" y="537.5">33.9%</text><path class="b1" d="M640.0 526.0 h82.5 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-82.5 z"/><text class="v" x="732.5" y="537.5">4.3</text></g>
<text class="st" x="24" y="570.0">BestCompression (smallest)</text>
<rect class="band" x="16" y="593.0" width="1068" height="24" rx="4"/><g><title>moego/png: ratio 31.82% (71.8 MB), 1.77 MP/s</title><text class="nmm" x="178" y="609.5" text-anchor="end">moego/png</text><circle class="d0" cx="271.9" cy="605.0" r="7.0"/><text class="vm" x="283.9" y="609.5">31.8%</text><path class="b0" d="M640.0 598.0 h236.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-236.0 z"/><text class="vm" x="886.0" y="609.5">1.8, 1.1× image/png</text></g>
<g><title>image/png: ratio 33.49% (75.5 MB), 1.67 MP/s</title><text class="nm" x="178" y="635.5" text-anchor="end">image/png</text><circle class="d1" cx="328.7" cy="631.0" r="5.5"/><text class="v" x="339.2" y="635.5">33.5%</text><path class="b1" d="M640.0 624.0 h222.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-222.0 z"/><text class="v" x="872.0" y="635.5">1.7</text></g>
<g><title>woozymasta/png: ratio 33.32% (75.1 MB), 1.62 MP/s</title><text class="nm" x="178" y="661.5" text-anchor="end">woozymasta/png</text><circle class="d1" cx="322.7" cy="657.0" r="5.5"/><text class="v" x="333.2" y="661.5">33.3%</text><path class="b1" d="M640.0 650.0 h214.9 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-214.9 z"/><text class="v" x="864.9" y="661.5">1.6</text></g>
<g><title>libdeflate 12 (C): ratio 31.92% (72.0 MB), 1.14 MP/s</title><text class="nm" x="178" y="687.5" text-anchor="end">libdeflate 12 (C)</text><circle class="d1" cx="275.3" cy="683.0" r="5.5"/><text class="v" x="285.8" y="687.5">31.9%</text><path class="b1" d="M640.0 676.0 h150.9 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-150.9 z"/><text class="v" x="800.9" y="687.5">1.1</text></g>
<g><title>libpng 9 (C): ratio 33.53% (75.6 MB), 1.65 MP/s</title><text class="nm" x="178" y="713.5" text-anchor="end">libpng 9 (C)</text><circle class="d1" cx="330.1" cy="709.0" r="5.5"/><text class="v" x="340.6" y="713.5">33.5%</text><path class="b1" d="M640.0 702.0 h218.8 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-218.8 z"/><text class="v" x="868.8" y="713.5">1.6</text></g>
<text class="cap" x="24" y="770">Raw pixel data counts 3 bytes per pixel (4 with alpha), 226 MB in all. moego/png with KeepColorType writes image/png&#39;s color types; its default color reduction is about 0.4% smaller still.</text>
<text class="cap" x="24" y="790">Intel Xeon E5-2699A v4 (AVX2, KVM guest), linux/amd64, Go 1.26.6, GOMAXPROCS=1, one pinned CPU per process. fpnge (no LZ77 search) is under BestSpeed only. Measured with bench/image.</text>
</svg>
