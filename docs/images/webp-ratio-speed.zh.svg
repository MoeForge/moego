<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title">
<title id="title">WebP 无损编码：压缩率和编码速度</title>
<style>
text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.bg{fill:#fcfcfb}.t1{font-size:21px;font-weight:700;fill:#0b0b0b}.t2{font-size:13px;fill:#52514e}
.st{font-size:14.5px;font-weight:700;fill:#0b0b0b}.ch{font-size:14px;font-weight:700;fill:#0b0b0b}.cs{font-size:12px;fill:#52514e}
.nm{font-size:13px;fill:#52514e}.nmm{font-size:13.5px;font-weight:700;fill:#0b0b0b}
.v{font-size:12.5px;fill:#52514e}.vm{font-size:13px;font-weight:700;fill:#0b0b0b}
.cap{font-size:11.5px;fill:#6f6d68}.ax{stroke:#8f8d86;stroke-width:1}.grid{stroke:#e4e3df;stroke-width:1}
.b0{fill:#2a78d6}.b1{fill:#a3a29c}.d0{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2}.d1{fill:#a3a29c;stroke:#fcfcfb;stroke-width:2}
.band{fill:#2a78d6;fill-opacity:.07}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1,.st,.ch,.nmm,.vm{fill:#f0efec}.t2,.cs,.nm,.v{fill:#c3c2b7}.cap{fill:#9a9891}
.grid{stroke:#383835}.b0{fill:#3987e5}.b1{fill:#6f6d68}.d0{fill:#3987e5;stroke:#1a1a19}.d1{fill:#6f6d68;stroke:#1a1a19}
.band{fill:#3987e5;fill-opacity:.12}}
</style>
<rect class="bg" width="100%" height="100%"/>
<text class="t1" x="24" y="40">WebP 无损编码：压缩率和编码速度</text>
<text class="t2" x="24" y="64">97 张公开图片（照片、截图、图标、纹理、透明抠图，69.8 MP），单线程。每组是同一压缩级别下的各个编码器，最后一行是同级别的 moego/png，作为 PNG 的对照。</text>
<rect class="b0" x="24" y="80" width="14" height="10" rx="2"/><text class="cs" x="44" y="90">moego/webp（纯 Go）</text><rect class="b1" x="188" y="80" width="14" height="10" rx="2"/><text class="cs" x="208" y="90">其他编码器；标 C 的是经 cgo 调用的 C 库</text>
<text class="ch" x="210" y="132">压缩率 ← 越靠左文件越小</text><text class="cs" x="210" y="150">压缩后大小占原始像素数据的比例；横轴从 20% 开始</text>
<text class="ch" x="640" y="132">编码速度 → 越长越快</text><text class="cs" x="640" y="150">每秒编码的百万像素（MP/s）；按组内最快的 WebP 缩放，PNG 只标数字</text>
<line class="grid" x1="210.0" x2="210.0" y1="170" y2="752"/><text class="cs" x="210.0" y="768" text-anchor="middle">20%</text>
<line class="grid" x1="278.0" x2="278.0" y1="170" y2="752"/><text class="cs" x="278.0" y="768" text-anchor="middle">24%</text>
<line class="grid" x1="346.0" x2="346.0" y1="170" y2="752"/><text class="cs" x="346.0" y="768" text-anchor="middle">28%</text>
<line class="grid" x1="414.0" x2="414.0" y1="170" y2="752"/><text class="cs" x="414.0" y="768" text-anchor="middle">32%</text>
<line class="grid" x1="482.0" x2="482.0" y1="170" y2="752"/><text class="cs" x="482.0" y="768" text-anchor="middle">36%</text>
<line class="grid" x1="550.0" x2="550.0" y1="170" y2="752"/><text class="cs" x="550.0" y="768" text-anchor="middle">40%</text>
<line class="ax" x1="640" x2="640" y1="170" y2="752"/>
<text class="st" x="24" y="192.0">BestSpeed（最快）</text>
<rect class="band" x="16" y="215.0" width="1068" height="24" rx="4"/><g><title>moego/webp：压缩率 26.27%（59.2 MB），31.12 MP/s</title><text class="nmm" x="178" y="231.5" text-anchor="end">moego/webp</text><circle class="d0" cx="316.6" cy="227.0" r="7.0"/><text class="vm" x="328.6" y="231.5">26.3%</text><path class="b0" d="M640.0 220.0 h236.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-236.0 z"/><text class="vm" x="886.0" y="231.5">31.1，libwebp 的 1.65 倍</text></g>
<g><title>libwebp z0（C）：压缩率 27.83%（62.8 MB），18.87 MP/s</title><text class="nm" x="178" y="257.5" text-anchor="end">libwebp z0（C）</text><circle class="d1" cx="343.1" cy="253.0" r="5.5"/><text class="v" x="353.6" y="257.5">27.8%</text><path class="b1" d="M640.0 246.0 h141.5 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-141.5 z"/><text class="v" x="791.5" y="257.5">18.9</text></g>
<g><title>SeriousBug 0：压缩率 26.44%（59.6 MB），7.49 MP/s</title><text class="nm" x="178" y="283.5" text-anchor="end">SeriousBug 0</text><circle class="d1" cx="319.5" cy="279.0" r="5.5"/><text class="v" x="330.0" y="283.5">26.4%</text><path class="b1" d="M640.0 272.0 h53.8 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-53.8 z"/><text class="v" x="703.8" y="283.5">7.49</text></g>
<g><title>nativewebp：压缩率 26.69%（60.2 MB），1.58 MP/s</title><text class="nm" x="178" y="309.5" text-anchor="end">nativewebp</text><circle class="d1" cx="323.8" cy="305.0" r="5.5"/><text class="v" x="334.3" y="309.5">26.7%</text><path class="b1" d="M640.0 298.0 h8.2 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-8.2 z"/><text class="v" x="658.2" y="309.5">1.58</text></g>
<g><title>moego/png（PNG）：压缩率 34.61%（78.0 MB），26.08 MP/s</title><text class="nm" x="178" y="335.5" text-anchor="end">moego/png（PNG）</text><circle class="d1" cx="458.3" cy="331.0" r="5.5"/><text class="v" x="468.8" y="335.5">34.6%</text><text class="v" x="646.0" y="335.5">26.1</text></g>
<text class="st" x="24" y="368.0">默认级别</text>
<rect class="band" x="16" y="391.0" width="1068" height="24" rx="4"/><g><title>moego/webp：压缩率 23.62%（53.3 MB），3.04 MP/s</title><text class="nmm" x="178" y="407.5" text-anchor="end">moego/webp</text><circle class="d0" cx="271.6" cy="403.0" r="7.0"/><text class="vm" x="283.6" y="407.5">23.6%</text><path class="b0" d="M640.0 396.0 h236.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-236.0 z"/><text class="vm" x="886.0" y="407.5">3.04，libwebp 的 1.78 倍</text></g>
<g><title>libwebp z6（C）：压缩率 23.98%（54.1 MB），1.70 MP/s</title><text class="nm" x="178" y="433.5" text-anchor="end">libwebp z6（C）</text><circle class="d1" cx="277.7" cy="429.0" r="5.5"/><text class="v" x="288.2" y="433.5">24.0%</text><path class="b1" d="M640.0 422.0 h130.6 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-130.6 z"/><text class="v" x="780.6" y="433.5">1.70</text></g>
<g><title>deepteams z6：压缩率 25.06%（56.5 MB），1.55 MP/s</title><text class="nm" x="178" y="459.5" text-anchor="end">deepteams z6</text><circle class="d1" cx="296.0" cy="455.0" r="5.5"/><text class="v" x="306.5" y="459.5">25.1%</text><path class="b1" d="M640.0 448.0 h118.5 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-118.5 z"/><text class="v" x="768.5" y="459.5">1.55</text></g>
<g><title>SeriousBug 6：压缩率 24.97%（56.3 MB），0.97 MP/s</title><text class="nm" x="178" y="485.5" text-anchor="end">SeriousBug 6</text><circle class="d1" cx="294.5" cy="481.0" r="5.5"/><text class="v" x="305.0" y="485.5">25.0%</text><path class="b1" d="M640.0 474.0 h72.9 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-72.9 z"/><text class="v" x="722.9" y="485.5">0.97</text></g>
<g><title>nativewebp：压缩率 26.65%（60.1 MB），1.45 MP/s</title><text class="nm" x="178" y="511.5" text-anchor="end">nativewebp</text><circle class="d1" cx="323.0" cy="507.0" r="5.5"/><text class="v" x="333.5" y="511.5">26.6%</text><path class="b1" d="M640.0 500.0 h110.7 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-110.7 z"/><text class="v" x="760.7" y="511.5">1.45</text></g>
<g><title>moego/png（PNG）：压缩率 33.50%（75.5 MB），11.84 MP/s</title><text class="nm" x="178" y="537.5" text-anchor="end">moego/png（PNG）</text><circle class="d1" cx="439.5" cy="533.0" r="5.5"/><text class="v" x="450.0" y="537.5">33.5%</text><text class="v" x="646.0" y="537.5">11.8</text></g>
<text class="st" x="24" y="570.0">BestCompression（最小）</text>
<rect class="band" x="16" y="593.0" width="1068" height="24" rx="4"/><g><title>moego/webp：压缩率 23.35%（52.7 MB），0.94 MP/s</title><text class="nmm" x="178" y="609.5" text-anchor="end">moego/webp</text><circle class="d0" cx="266.9" cy="605.0" r="7.0"/><text class="vm" x="278.9" y="609.5">23.3%</text><path class="b0" d="M640.0 598.0 h171.7 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-171.7 z"/><text class="vm" x="821.7" y="609.5">0.94，libwebp 的 10.5 倍</text></g>
<g><title>libwebp z9（C）：压缩率 23.47%（52.9 MB），0.09 MP/s</title><text class="nm" x="178" y="635.5" text-anchor="end">libwebp z9（C）</text><circle class="d1" cx="269.1" cy="631.0" r="5.5"/><text class="v" x="279.6" y="635.5">23.5%</text><path class="b1" d="M640.0 624.0 h12.8 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-12.8 z"/><text class="v" x="662.8" y="635.5">0.09</text></g>
<g><title>deepteams z9：压缩率 24.61%（55.5 MB），0.40 MP/s</title><text class="nm" x="178" y="661.5" text-anchor="end">deepteams z9</text><circle class="d1" cx="288.4" cy="657.0" r="5.5"/><text class="v" x="298.9" y="661.5">24.6%</text><path class="b1" d="M640.0 650.0 h70.1 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-70.1 z"/><text class="v" x="720.1" y="661.5">0.40</text></g>
<g><title>SeriousBug 6：压缩率 24.97%（56.3 MB），0.97 MP/s</title><text class="nm" x="178" y="687.5" text-anchor="end">SeriousBug 6</text><circle class="d1" cx="294.5" cy="683.0" r="5.5"/><text class="v" x="305.0" y="687.5">25.0%</text><path class="b1" d="M640.0 676.0 h178.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-178.0 z"/><text class="v" x="828.0" y="687.5">0.97</text></g>
<g><title>nativewebp：压缩率 26.60%（60.0 MB），1.28 MP/s</title><text class="nm" x="178" y="713.5" text-anchor="end">nativewebp</text><circle class="d1" cx="322.1" cy="709.0" r="5.5"/><text class="v" x="332.6" y="713.5">26.6%</text><path class="b1" d="M640.0 702.0 h236.0 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -4 4 h-236.0 z"/><text class="v" x="886.0" y="713.5">1.28</text></g>
<g><title>moego/png（PNG）：压缩率 31.82%（71.8 MB），1.74 MP/s</title><text class="nm" x="178" y="739.5" text-anchor="end">moego/png（PNG）</text><circle class="d1" cx="410.9" cy="735.0" r="5.5"/><text class="v" x="421.4" y="739.5">31.8%</text><text class="v" x="646.0" y="739.5">1.74</text></g>
<text class="cap" x="24" y="796">原始像素数据按每像素 3 字节（带透明的 4 字节）计，共 226 MB。所有输出都保留透明像素下的 RGB（libwebp 为 exact=1）。SeriousBug 最高 effort 6；deepteams z0 压缩率 49.4%，不在图内。</text>
<text class="cap" x="24" y="816">BestCompression 的 moego/webp 和 libwebp z9 是在全部 97 张图上单独计时的速度。</text>
<text class="cap" x="24" y="836">Intel Xeon E5-2699A v4（AVX2，KVM 虚拟机），linux/amd64，Go 1.26.6，libwebp 1.5.0，GOMAXPROCS=1，每个进程绑定一个 CPU。用 bench/image 测量。</text>
</svg>
